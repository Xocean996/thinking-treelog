name: Thinking TreeLog lint
description: Lint design docs, RFCs and ADRs for reasoning gaps — decisions without evidence, unverified assumptions, rejected options that still carry children.
author: Thinking TreeLog
branding:
  icon: git-branch
  color: blue

inputs:
  files:
    description: Paths or globs of the documents to lint.
    required: false
    default: docs/**/*.md
  format:
    description: Output format — text, sarif, github, junit or json.
    required: false
    default: text
  fail-on:
    description: Fail the step on error, warning, or never.
    required: false
    default: error
  max-depth:
    description: Maximum allowed decision-chain depth.
    required: false
    default: '8'
  baseline:
    description: Path to a baseline file of accepted findings. Empty means none.
    required: false
    default: ''
  config:
    description: Path to a treelog config file. Empty means nearest treelog.config.json.
    required: false
    default: ''
  lang:
    description: Message language — en or zh.
    required: false
    default: en

outputs:
  sarif:
    description: Path to the SARIF file when format is sarif.
    value: ${{ steps.lint.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install workspace links
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-audit --no-fund --ignore-scripts

    - name: Lint thought trees
      id: lint
      shell: bash
      run: |
        shopt -s globstar nullglob
        files=( ${{ inputs.files }} )
        if [ ${#files[@]} -eq 0 ]; then
          echo "treelog: no files matched '${{ inputs.files }}' — nothing to lint"
          exit 0
        fi

        args=( lint "${files[@]}" )
        args+=( --format "${{ inputs.format }}" )
        args+=( --fail-on "${{ inputs.fail-on }}" )
        args+=( --max-depth "${{ inputs.max-depth }}" )
        args+=( --lang "${{ inputs.lang }}" )

        if [ -n "${{ inputs.baseline }}" ]; then
          args+=( --baseline "${{ inputs.baseline }}" )
        fi
        if [ -n "${{ inputs.config }}" ]; then
          args+=( --config "${{ inputs.config }}" )
        fi

        if [ "${{ inputs.format }}" = "sarif" ]; then
          args+=( --out treelog.sarif )
          node "${{ github.action_path }}/packages/cli/bin/treelog.mjs" "${args[@]}"
          echo "sarif=treelog.sarif" >> "$GITHUB_OUTPUT"
        else
          node "${{ github.action_path }}/packages/cli/bin/treelog.mjs" "${args[@]}"
        fi
