name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Link workspace packages
        run: npm install --no-audit --no-fund

      - name: Core engine tests
        run: npm run test:core

      - name: Engineering tests (markdown, lint, SARIF, config, baseline)
        run: npm run test:engineering

      - name: Plan interface lint
        run: npm run test:plan

      - name: Client half smoke test
        run: npm run test:client

      - name: Client ⇄ core parity
        run: npm run test:consistency

      - name: MCP tools
        run: npm run test:mcp
